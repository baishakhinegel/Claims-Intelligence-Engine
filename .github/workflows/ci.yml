name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generate Prisma client
        run: npm run prisma:generate -w apps/api
      - name: Typecheck API
        run: npm run typecheck
      - name: Unit tests (no DB / no OpenAI key needed)
        run: npm test
      - name: Build API + Web
        run: npm run build
      - name: Dependency audit (high+)
        run: npm audit --audit-level=high --omit=dev || true
